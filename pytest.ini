[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast critical-path checks, run on every commit
    regression: full functional coverage
    critical: P0 revenue, auth or access path
    negative: invalid input and error handling
    e2e: full user journey across multiple pages
    api: API-level test, no browser UI
    login: login page and authentication
    menu: navigation and menu access validation
    platform_admin: executed as the Platform Admin role
    dealer_admin: executed as the Dealer Admin role (future phase)
    user: executed as the User role (future phase)
    read_only_user: executed as the Read-Only User role (future phase)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)7s] %(message)s
log_cli_date_format = %H:%M:%S
